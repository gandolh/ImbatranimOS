# ImbatranimOS compose. Build context is the repo root (..) because the
# image needs the workspace root (package.json, lockfile, turbo.json) plus
# the apps/ tree.
#
#   Prod (the friend-run experience):
#     docker compose -f infrastructure/docker-compose.yml up imbatranimos
#   Dev (HMR):
#     docker compose -f infrastructure/docker-compose.yml --profile dev up
services:
  # Slim single-container product: desktop + API + (future) WS on one port.
  imbatranimos:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      target: prod
      # Sub-path build args (default root / same-origin). A Caddy sub-path
      # deploy exports VITE_BASE + VITE_API_URL before `docker compose build`.
      args:
        VITE_BASE: ${VITE_BASE:-/}
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: imbatranimos:1.0
    ports:
      # Bound to LOOPBACK, not 0.0.0.0: on the VPS this container sits behind
      # Caddy (handle_path /imbatranim-os/* → localhost:8080), and publishing on
      # every interface made the app reachable over plain HTTP on :8080,
      # bypassing TLS and the reverse proxy entirely. Only the proxy (and other
      # processes on the box) can reach it now. For a LAN/localhost run this is
      # still what you want; drop the prefix only to expose it deliberately.
      - "127.0.0.1:8080:8080"
      # The Browser app's proxy origin (brief 50): proxied web pages are served
      # from this second port, never the desktop's, so a hostile page cannot
      # act as you on the desktop. Loopback-bound for the same reason as above.
      - "127.0.0.1:8081:8081"
    # Runtime configuration, when there is any. vps-deploy's `server` phase
    # writes this file (0600) with the deploy's SETUP_TOKEN, so the public
    # deploy cannot be claimed by whoever reaches it before its owner.
    #
    # `required: false` keeps the standalone run in the README working: a
    # friend cloning this repo has no .env, and compose treats a missing
    # env_file as fatal unless told otherwise. The first visit sets the
    # password. Add SETUP_TOKEN here when the machine is reachable by others
    # before you claim it.
    env_file:
      - path: .env
        required: false
    environment:
      # The Browser listens for its proxy origin here. Its address is
      # FRONTEND_URL's host on this port; behind a TLS proxy, set
      # BROWSER_PROXY_ORIGIN to where browsers reach it. Remove to turn the
      # Browser off.
      - BROWSER_PROXY_PORT=8081
    volumes:
      - imbatranim-home:/home/imbatranim
    restart: unless-stopped
    # Mirrors the Dockerfile HEALTHCHECK (the image already carries one); stated
    # here too so `docker compose ps` reports health and the interval is tunable.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
    # TRUST_PROXY MUST stay at its safe default (false) unless the proxy in
    # front is known to OVERWRITE X-Forwarded-* rather than append to it: a
    # client that forges the header would otherwise defeat IP-based login
    # rate-limiting. Caddy's reverse_proxy appends, so the forged prefix
    # survives — leave this alone until the Caddyfile resets the header.
    # The local sign-in needs no switch for HTTPS: its session cookie is
    # marked Secure whenever the proxy says the browser used HTTPS
    # (X-Forwarded-Proto). Behind Caddy with TRUST_PROXY off, every client
    # shares the proxy's address, so the sign-in backoff is shared too.
    # Optional settings:
    # environment:
    #   - SETUP_TOKEN=<only you know it>   # needed to claim the machine first
    #   - TRUST_PROXY=true                 # only behind a proxy that OVERWRITES X-Forwarded-For

  # Development, fully contained (brief 51): Nest watch + Vite HMR with source
  # changes SYNCED into the container by `docker compose watch` — run it via
  # `npm run dev`. No bind mounts and no anonymous-volume list: the old
  # hand-list of per-add-on node_modules volumes rotted twice (7/24 covered at
  # grilling time; 23/26 + none of packages/* by the time it was replaced),
  # because compose volumes cannot glob. Watch syncs into the container's own
  # filesystem, so container-side inotify fires natively — more reliable on
  # WSL2 than bind-mount event propagation — and the container's node_modules
  # are simply never shadowed in the first place.
  dev:
    profiles: ["dev"]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      target: dev
    ports:
      - "3001:3001"
      - "5173:5173"
      # The Browser's proxy origin (brief 50).
      - "3002:3002"
    environment:
      # Same origin as the desktop, through Vite's dev proxy, the way the
      # deploy serves it. A marketplace app's module is imported from the API
      # (brief 120), and a cross-origin module import carries no cookie.
      - VITE_API_URL=/api
      - BROWSER_PROXY_PORT=3002
    develop:
      watch:
        # Source sync — node_modules excluded: the container owns its deps.
        - action: sync
          path: ../apps
          target: /app/apps
          ignore:
            - "**/node_modules/**"
        # The shared workspace packages (the @imbatranim/ui SDK, pdfcore) are
        # source too — the old bind-mount flow never covered them at all.
        - action: sync
          path: ../packages
          target: /app/packages
          ignore:
            - "**/node_modules/**"
        # The marketplace catalog (brief 120), read on every listing.
        - action: sync
          path: ../marketplace
          target: /app/marketplace
        # Dependency- or image-shape changes need a real rebuild, not a sync.
        - action: rebuild
          path: ../package-lock.json
        - action: rebuild
          path: ../package.json
        - action: rebuild
          path: ../turbo.json
        - action: rebuild
          path: Dockerfile
    volumes:
      - imbatranim-home-dev:/home/imbatranim

volumes:
  imbatranim-home:
  imbatranim-home-dev:
