# Nix for Linux apps. Installed root-owned at /etc/nix/nix.conf; Nix itself
# runs single-user as `imbatranim`, who owns /nix (its own volume).

# Single-user: no build users and no daemon.
build-users-group =

# The build sandbox needs user namespaces, which an unprivileged container
# doesn't get. Nothing is built here anyway (next setting).
sandbox = false

# Install from the binary cache only. A package with no cached binary fails
# instead of compiling on the machine.
max-jobs = 0

# Nothing is built here, so the derivations an install evaluates are never
# needed again. Kept (Nix's default), they outlive every garbage collection:
# about 1,800 files and 9 MB in the image's base profile, and 18 MB more after
# Firefox (measured 2026-11-03).
keep-derivations = false

experimental-features = nix-command flakes

substituters = https://cache.nixos.org
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

# Profiles, caches and settings live under $NIX_STATE_HOME, $NIX_CACHE_HOME,
# $NIX_CONFIG_HOME and $NIX_DATA_HOME, which the image points into /nix. This
# keeps ~/.nix-profile and ~/.cache/nix out of the home folder, so a backup
# never carries a link that points outside it.
use-xdg-base-directories = true

# `nixpkgs` resolves through the system registry (/etc/nix/registry.json, made
# from infrastructure/nix/nixpkgs-pin.env at image build) to the pinned commit,
# unless Settings → Updates moved the pin: then the user registry,
# $NIX_CONFIG_HOME/registry.json on the /nix volume, names a newer one, and
# Nix reads it first.
# No global registry: nothing to download, nothing else to resolve against.
flake-registry =
