      ['shopping-list.txt', '81 B', 'Nov 2, 2026', true]
    ].map(function (d) {
      var s = d[3];
      return {
        name: d[0], size: d[1], date: d[2], isFile: s, isFolder: !s,
        bg: s ? accent : 'transparent',
        fg: s ? c.accentOn : c.on,
        fgVar: s ? c.accentOn : c.onVar,
        icon: s ? c.accentOn : (warm ? c.ink : c.onVar),
        border: warm ? 'transparent' : (s ? accent : c.outlineVar),
        weight: s ? '600' : '400'
      };
    });

    var rail = ['Appearance', 'Marketplace', 'Account', 'About'].map(function (n, i) {
      var s = i === 0;
      return {
        name: n,
        bg: s ? (warm ? c.high : accent) : 'transparent',
        fg: s ? (warm ? c.ink : c.accentOn) : c.on,
        weight: s ? '600' : '400'
      };
    });

    function seg(labels, onIndex) {
      return labels.map(function (label, i) {
        var on = i === onIndex;
        return { label: label, bg: on ? accent : 'transparent', fg: on ? c.accentOn : c.on, weight: on ? '600' : '500', pressed: on ? 'true' : 'false' };
      });
    }

    var swatches = L.accents.map(function (hex, i) {
      var on = i === 0;
      return {
        hex: hex, name: L.accentNames[i], pressed: on ? 'true' : 'false',
        ring: on ? '0 0 0 2px ' + c.lowest + ', 0 0 0 4px ' + c.on : 'inset 0 0 0 1px rgba(0, 0, 0, 0.08)'
      };
    });

    var hz = { h1: w.h1 || w.cloud2, h2: w.h2 || w.cloud2, h3: w.h3 || w.cloud };
    var thumbs;
    if (warm) {
      thumbs = [
        { label: L.scene, bg: 'radial-gradient(circle at 78% 30%, ' + w.sun + ' 0 9%, transparent 10%), linear-gradient(180deg, ' + w.sky1 + ' 0%, ' + w.sky3 + ' 56%, ' + hz.h1 + ' 56%, ' + hz.h1 + ' 70%, ' + hz.h2 + ' 70%, ' + hz.h2 + ' 84%, ' + hz.h3 + ' 84%)' },
        { label: 'Plain', bg: c.high },
        { label: 'Soft dots', bg: 'radial-gradient(' + c.outline + ' 1.2px, transparent 1.6px) 0 0 / 10px 10px, ' + c.surface }
      ];
    } else {
      thumbs = [
        { label: 'Dots', bg: 'radial-gradient(' + c.outline + ' 1px, transparent 1px) 0 0 / 8px 8px, ' + c.surface },
        { label: 'Grid', bg: 'linear-gradient(' + c.outlineVar + ' 1px, transparent 1px) 0 0 / 12px 12px, linear-gradient(90deg, ' + c.outlineVar + ' 1px, transparent 1px) 0 0 / 12px 12px, ' + c.surface },
        { label: 'Linen', bg: 'repeating-linear-gradient(45deg, ' + c.outlineVar + ' 0 1px, transparent 1px 4px), ' + c.surface }
      ];
    }
    thumbs = thumbs.map(function (t, i) {
      var on = i === 0;
      return { label: t.label, bg: t.bg, pressed: on ? 'true' : 'false', ring: on ? '0 0 0 2px ' + c.lowest + ', 0 0 0 4px ' + c.ink : '0 0 0 1px ' + c.outlineVar };
    });

    var themeCards = [warm ? key : 'apricot', 'classic'].map(function (k) {
      var T = all[k];
      var p = dark ? T.dark : T.light;
      var on = k === key;
      var pw = p.w;
      var wall = T.warm
        ? 'radial-gradient(circle at 80% 26%, ' + pw.sun + ' 0 8%, transparent 9%), linear-gradient(180deg, ' + pw.sky1 + ' 0%, ' + pw.sky3 + ' 60%, ' + (pw.h1 || pw.cloud2) + ' 60%, ' + (pw.h2 || pw.cloud2) + ' 80%, ' + (pw.h3 || pw.cloud) + ' 80%)'
        : 'radial-gradient(' + p.outlineVar + ' 1px, transparent 1px) 0 0 / 6px 6px, ' + p.surface;
      return {
        name: k.charAt(0).toUpperCase() + k.slice(1),
        pressed: on ? 'true' : 'false',
        weight: on ? '600' : '500',
        ring: on ? '0 0 0 2px ' + c.lowest + ', 0 0 0 4px ' + c.ink : '0 0 0 1px ' + c.outlineVar,
        wall: wall,
        win: p.lowest,
        title: T.warm ? p.container : p.high,
        border: p.outlineVar,
        bar: p.low,
        accent: T.accents[0],
        winR: T.warm ? '5px' : '0px',
        ctlR: T.warm ? '3px' : '0px'
      };
    });

    return {
      themeCards: themeCards,
      font: "'" + fontName + "', ui-sans-serif, system-ui, sans-serif",
      c: c, w: w, r: r, wallBg: wallBg,
      isApricot: key === 'apricot', isSage: key === 'sage', isLavender: key === 'lavender',
      di: {
        bg: warm ? c.lowest : 'transparent',
        shadow: warm ? c.tileShadow : 'none',
        icon: warm ? c.ink : c.on,
        label: c.on
      },
      fm: { border: c.outlineVar, title: warm ? c.low : c.container },
      st: { border: warm ? c.outlineVar : accent, title: warm ? c.container : c.high },
      btn: { bg: warm ? c.container : 'transparent', border: warm ? c.container : c.outlineVar },
      lab: warm ? { size: '12px', transform: 'none', spacing: '0' } : { size: '11px', transform: 'uppercase', spacing: '0.08em' },
      sidePad: warm ? '6px' : '0',
      rowPadX: warm ? '16px' : '10px',
      rowM: warm ? '2px 6px 0' : '0',
      side: side, rows: rows, rail: rail,
      lookSeg: seg(['Warm', 'Classic'], warm ? 0 : 1),
      themeSeg: seg(['Light', 'Dark'], dark ? 1 : 0),
      swatches: swatches, thumbs: thumbs,
      sm: {
        left: warm ? '8px' : '0px',
        top: warm ? '344px' : '352px',
        tile: warm ? c.container : 'transparent',
        icon: warm ? c.ink : c.onVar
      },
      tb: {
        pad: warm ? '6px 8px' : '0',
        gap: warm ? '6px' : '0',
        sep: warm ? '0' : '1px solid ' + c.outlineVar,
        searchW: warm ? '220px' : 'auto',
        searchBg: warm ? c.container : 'transparent',
        taskPad: warm ? '0' : '0 6px',
        edge: warm ? 0 : 1
      },
      ind: warm
        ? { left: 'calc(50% - 7px)', width: '14px', bottom: '3px', height: '3px', radius: '999px', color: c.ink }
        : { left: '0', width: '100%', bottom: '-6px', height: '2px', radius: '0', color: accent }
    };
  }
}
</script>
</body>
</html>
