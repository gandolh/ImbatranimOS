[package]
name = "imbatranim-wayland-host"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "The Wayland host: the display Linux apps connect to. Windows go out as images, input comes in, over a local socket to the backend."
publish = false

[[bin]]
name = "imbatranim-wayland-host"
path = "src/main.rs"

[dependencies]
# Only the Wayland server side. No renderer, winit, udev or backend features:
# the host never draws, it reads the buffers clients hand it.
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend"] }
flate2 = "1.1"
image-webp = "0.2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
