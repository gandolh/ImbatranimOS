[package]
name = "imbatranim-wayland-host"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "The Wayland host: the display Linux apps connect to. Windows go out as images, input comes in, over a local socket to the backend."
publish = false

[[bin]]
name = "imbatranim-wayland-host"
path = "src/main.rs"

[dependencies]
# Only the Wayland server side. No renderer, winit, udev or backend features:
# the host never draws, it reads the buffers clients hand it. `xwayland` is
# the X11 window manager for Xwayland, which runs only once an X client
# connects (src/xwayland.rs).
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend", "xwayland"] }
flate2 = "1.1"
image-webp = "0.2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jpeg-encoder = "0.7.1"
# Already built for smithay (with these features): fd flags, the X lock
# files' liveness check, and a blocking end for clipboard pipes.
rustix = { version = "1.0.7", default-features = false, features = ["std", "process", "event"] }
# Linux apps' sound. The host is each session's PulseAudio server (sound/):
# this crate reads and writes PulseAudio's native protocol, so no sound
# daemon goes in the image (PulseAudio or PipeWire with its shim cost about
# 250 MB there, with mesa and gstreamer). libopus is built from the source
# the crate bundles and linked in statically, so the runtime image needs
# nothing either; the build stage needs cmake.
pulseaudio = "0.3.2"
opus = "0.4.0"

# smithay 0.7.0 with one fix in its X11 window manager: a paste over 64 KiB
# (sent in chunks, X11's INCR) also reaches an app that asks from a child
# window, as xterm does. Upstream doesn't have it yet; vendor/README.md says
# what changed and when this can go.
[patch.crates-io]
smithay = { path = "vendor/smithay" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
